<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>litecode runs</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
        --border: rgba(11, 11, 11, 0.1);
        --hover: rgba(11, 11, 11, 0.04);
        --link: #1c5cab;
        --fam-triage: #2a78d6;
        --fam-design: #eb6834;
        --fam-adversary: #1baf7a;
        --fam-design-final: #eda100;
        --fam-implement: #e87ba4;
        --fam-review: #008300;
        --fam-fix: #4a3aa7;
        --fam-orchestrator: #898781;
        --st-good: #0ca30c;
        --st-serious: #ec835a;
        --st-critical: #d03b3b;
        --st-none: #c3c2b7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --page: #0d0d0d;
          --surface: #1a1a19;
          --ink: #ffffff;
          --ink-2: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --axis: #383835;
          --border: rgba(255, 255, 255, 0.1);
          --hover: rgba(255, 255, 255, 0.05);
          --link: #86b6ef;
          --fam-triage: #3987e5;
          --fam-design: #d95926;
          --fam-adversary: #199e70;
          --fam-design-final: #c98500;
          --fam-implement: #d55181;
          --fam-review: #008300;
          --fam-fix: #9085e9;
          --st-none: #383835;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --border: rgba(255, 255, 255, 0.1);
        --hover: rgba(255, 255, 255, 0.05);
        --link: #86b6ef;
        --fam-triage: #3987e5;
        --fam-design: #d95926;
        --fam-adversary: #199e70;
        --fam-design-final: #c98500;
        --fam-implement: #d55181;
        --fam-review: #008300;
        --fam-fix: #9085e9;
        --st-none: #383835;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 2px;
        font-weight: 600;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 2px;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        margin: 20px 0 8px;
        font-weight: 600;
      }
      .sub {
        color: var(--ink-2);
        font-size: 13px;
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        margin: 16px 0 20px;
      }
      .filters label {
        color: var(--ink-2);
        font-size: 13px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
      }
      button {
        cursor: pointer;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--ink-2);
      }
      .seg button[aria-pressed='true'] {
        background: var(--hover);
        color: var(--ink);
        font-weight: 600;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .tile .label {
        color: var(--ink-2);
        font-size: 12px;
      }
      .tile .value {
        font-size: 24px;
        font-weight: 600;
        margin-top: 2px;
      }
      .tile .note {
        color: var(--muted);
        font-size: 12px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 20px;
        min-width: 0;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 860px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      .grid2 > .card {
        margin-bottom: 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 8px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sw {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }
      svg {
        display: block;
        overflow: visible;
      }
      svg text {
        fill: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      svg text.ink {
        fill: var(--ink-2);
      }
      .gridline {
        stroke: var(--grid);
        stroke-width: 1;
      }
      .baseline {
        stroke: var(--axis);
        stroke-width: 1;
      }
      .table-wrap {
        overflow: auto;
        max-height: 560px;
        border-top: 1px solid var(--border);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        vertical-align: top;
      }
      td.wrap {
        white-space: normal;
        min-width: 220px;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--surface);
        color: var(--ink-2);
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        z-index: 1;
      }
      th.num,
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tbody tr.clickable {
        cursor: pointer;
      }
      tbody tr.clickable:hover,
      tbody tr.selected {
        background: var(--hover);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .status i {
        font-style: normal;
        font-size: 11px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
      }
      .ops td {
        color: var(--ink-2);
        font-size: 12px;
      }
      .ops td.label {
        white-space: normal;
        word-break: break-all;
        font-family: ui-monospace, Menlo, monospace;
      }
      #tip {
        position: fixed;
        pointer-events: none;
        z-index: 10;
        display: none;
        max-width: 340px;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }
      #tip b {
        font-weight: 600;
      }
      #tip .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--ink-2);
      }
      #tip .row span:last-child {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .empty {
        color: var(--muted);
        padding: 24px 0;
        text-align: center;
      }
      .chip {
        display: inline-block;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--hover);
        color: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>litecode runs</h1>
      <div class="sub" id="generated"></div>

      <div class="filters">
        <label
          >Repo
          <select id="f-repo"></select
        ></label>
        <label
          >Period
          <select id="f-days">
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="0" selected>All time</option>
          </select></label
        >
        <label
          >Route
          <select id="f-route">
            <option value="all">All</option>
            <option value="full">Full</option>
            <option value="small">Small</option>
          </select></label
        >
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="card">
        <div class="card-head">
          <div>
            <h2 id="trend-title">Per run</h2>
            <div class="sub">Each dot is a run. Click one for its breakdown.</div>
          </div>
          <div class="seg" id="trend-metric"></div>
        </div>
        <div id="trend"></div>
        <div class="legend" id="trend-legend"></div>
      </div>

      <div class="grid2">
        <div class="card">
          <div class="card-head">
            <div>
              <h2>Runs per day</h2>
              <div class="sub">By outcome</div>
            </div>
          </div>
          <div id="daily"></div>
          <div class="legend" id="daily-legend"></div>
        </div>
        <div class="card">
          <div class="card-head">
            <div>
              <h2>By stage</h2>
              <div class="sub" id="stage-sub">Median per stage run</div>
            </div>
            <div class="seg" id="stage-metric"></div>
          </div>
          <div id="stages"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div>
            <h2>Runs</h2>
            <div class="sub" id="runs-sub"></div>
          </div>
        </div>
        <div class="table-wrap"><table id="runs"></table></div>
      </div>

      <div class="card" id="detail" hidden></div>

      <div class="card">
        <div class="card-head">
          <div>
            <h2>GitHub issues filed</h2>
            <div class="sub" id="issues-sub"></div>
          </div>
        </div>
        <div class="table-wrap"><table id="issues"></table></div>
      </div>
    </main>
    <div id="tip"></div>
    <script type="application/json" id="data">
      /*__DATA__*/
    </script>
    <script>
      (() => {
        'use strict';
        const DATA = JSON.parse(document.getElementById('data').textContent);
        const FAMILIES = [
          'triage',
          'design',
          'adversary',
          'design-final',
          'implement',
          'review',
          'fix',
        ];
        const FAMILY_LABEL = {
          triage: 'Triage',
          design: 'Design',
          adversary: 'Adversary',
          'design-final': 'Final design',
          implement: 'Implement',
          review: 'Review',
          fix: 'Fix',
          orchestrator: 'Orchestrator',
          other: 'Other',
        };
        const OUTCOMES = [
          { key: 'pass', label: 'Passed', color: 'var(--st-good)', icon: '✓' },
          {
            key: 'unresolved',
            label: 'Unresolved findings',
            color: 'var(--st-serious)',
            icon: '!',
          },
          { key: 'stopped', label: 'Stopped', color: 'var(--st-critical)', icon: '■' },
          { key: 'incomplete', label: 'Incomplete / unknown', color: 'var(--st-none)', icon: '…' },
        ];
        const outcomeOf = (status) =>
          status.startsWith('pass')
            ? OUTCOMES[0]
            : status === 'unresolved'
              ? OUTCOMES[1]
              : status === 'stopped'
                ? OUTCOMES[2]
                : OUTCOMES[3];
        const METRICS = {
          agentMs: { label: 'Agent time', fmt: (v) => fmtDur(v), stage: (s) => s.activeMs },
          tokens: {
            label: 'Tokens',
            fmt: (v) => fmtTok(v),
            stage: (s) => s.input + s.cacheRead + s.cacheWrite + s.output,
          },
          output: { label: 'Output tokens', fmt: (v) => fmtTok(v), stage: (s) => s.output },
          peak: { label: 'Peak context', fmt: (v) => fmtTok(v), stage: (s) => s.peakContext },
        };

        // ---------- formatting ----------
        function fmtDur(ms) {
          if (!isFinite(ms) || ms <= 0) return '0s';
          const s = Math.round(ms / 1000);
          if (s < 60) return s + 's';
          const m = Math.floor(s / 60);
          if (m < 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's';
          const h = Math.floor(m / 60);
          return h + 'h ' + String(m % 60).padStart(2, '0') + 'm';
        }
        function fmtTok(n) {
          if (!isFinite(n)) return '–';
          if (n < 1000) return String(Math.round(n));
          if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k';
          if (n < 1e9) return (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + 'M';
          return (n / 1e9).toFixed(n < 1e10 ? 2 : 1) + 'B';
        }
        const fmtDate = (t) =>
          new Date(t).toLocaleString(undefined, {
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit',
          });
        const fmtDay = (t) =>
          new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        const esc = (s) =>
          String(s ?? '').replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
          );
        const median = (xs) => {
          if (!xs.length) return 0;
          const a = [...xs].sort((x, y) => x - y);
          const m = a.length >> 1;
          return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
        };
        const quantile = (xs, q) => {
          if (!xs.length) return 0;
          const a = [...xs].sort((x, y) => x - y);
          return a[Math.min(a.length - 1, Math.floor(q * a.length))];
        };
        const sum = (xs) => xs.reduce((n, x) => n + x, 0);

        // ---------- derived data ----------
        for (const run of DATA.runs) {
          const st = run.stages,
            o = run.orchestrator;
          const stageTok = sum(st.map(METRICS.tokens.stage));
          const orchTok = o.input + o.cacheRead + o.cacheWrite + o.output;
          run.m = {
            agentMs: sum(st.map((s) => s.activeMs)),
            elapsed: run.end - run.start,
            tokens: stageTok + orchTok,
            orchTokens: orchTok,
            output: sum(st.map((s) => s.output)) + o.output,
            peak: Math.max(0, ...st.map((s) => s.peakContext)),
            fixes: st.filter((s) => s.family === 'fix').length,
            compactions: o.compactions.length + sum(st.map((s) => s.compactions.length)),
            issues: run.issues.length,
          };
        }
        const runByKey = new Map(DATA.runs.map((r) => [r.key, r]));
        const allIssues = [
          ...DATA.runs.flatMap((r) => r.issues.map((i) => ({ ...i, run: r.key, repo: r.repo }))),
          ...DATA.otherIssues.map((i) => ({
            ...i,
            run: null,
            repo: (i.url.match(/github\.com\/[^/]+\/([^/]+)\//) || [])[1] || '',
            source: 'outside a run',
          })),
        ].map((i) => ({ ...i, meta: DATA.issueMeta[i.url] }));

        // ---------- state ----------
        const state = {
          repo: 'all',
          days: 0,
          route: 'all',
          trendMetric: 'agentMs',
          stageMetric: 'agentMs',
          sort: { key: 'start', dir: -1 },
          selected: null,
          showAll: false,
        };
        try {
          Object.assign(state, JSON.parse(localStorage.getItem('lc-analytics') || '{}'), {
            selected: null,
            showAll: false,
          });
        } catch {}
        const save = () => {
          try {
            localStorage.setItem(
              'lc-analytics',
              JSON.stringify({
                repo: state.repo,
                days: state.days,
                route: state.route,
                trendMetric: state.trendMetric,
                stageMetric: state.stageMetric,
              }),
            );
          } catch {}
        };

        function inPeriod(t) {
          return !state.days || t >= Date.now() - state.days * 864e5;
        }
        function filteredRuns() {
          return DATA.runs.filter(
            (r) =>
              (state.repo === 'all' || r.repo === state.repo) &&
              (state.route === 'all' || r.route === state.route) &&
              inPeriod(r.start),
          );
        }

        // ---------- svg + tooltip helpers ----------
        const NS = 'http://www.w3.org/2000/svg';
        function el(tag, attrs = {}, parent) {
          const e = document.createElementNS(NS, tag);
          for (const [k, v] of Object.entries(attrs))
            if (v !== undefined && v !== null) e.setAttribute(k, v);
          if (parent) parent.appendChild(e);
          return e;
        }
        function text(parent, x, y, s, attrs = {}) {
          const t = el('text', { x, y, ...attrs }, parent);
          t.textContent = s;
          return t;
        }
        const tip = document.getElementById('tip');
        function showTip(html, ev) {
          tip.innerHTML = html;
          tip.style.display = 'block';
          const r = tip.getBoundingClientRect();
          let x = ev.clientX + 14,
            y = ev.clientY + 14;
          if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
          if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
          tip.style.left = Math.max(8, x) + 'px';
          tip.style.top = Math.max(8, y) + 'px';
        }
        const hideTip = () => {
          tip.style.display = 'none';
        };
        const tipRows = (rows) =>
          rows
            .map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`)
            .join('');

        function niceTicks(max, count = 4) {
          if (max <= 0) return [0];
          const raw = max / count,
            p = Math.pow(10, Math.floor(Math.log10(raw)));
          const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
          const ticks = [];
          for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
          if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
          return ticks;
        }
        function durTicks(maxMs) {
          const steps = [
            1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600,
          ].map((s) => s * 1000);
          const step = steps.find((s) => maxMs / s <= 5) || steps[steps.length - 1];
          const ticks = [];
          for (let v = 0; v < maxMs + step; v += step) ticks.push(v);
          return ticks;
        }
        function timeTicks(t0, t1, maxTicks) {
          const H = 36e5,
            D = 864e5;
          const steps = [H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D, 14 * D, 30 * D];
          const step = steps.find((s) => (t1 - t0) / s <= maxTicks) || 30 * D;
          const start = new Date(t0);
          if (step >= D) start.setHours(0, 0, 0, 0);
          else start.setMinutes(0, 0, 0);
          const ticks = [];
          for (let t = start.getTime(); t <= t1; t += step) if (t >= t0) ticks.push(t);
          return { ticks, step };
        }
        function roundedBar(x, y, w, h, r, side) {
          // Rounded data-end only; square at the baseline. side: 'top' (columns) or 'right' (bars).
          r = Math.max(0, Math.min(r, side === 'top' ? h : w, (side === 'top' ? w : h) / 2));
          if (side === 'top')
            return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
          return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
        }
        function legend(container, items) {
          container.innerHTML = items
            .map(
              (i) =>
                `<span><span class="sw" style="background:${i.color}"></span>${esc(i.label)}</span>`,
            )
            .join('');
        }

        // ---------- tiles ----------
        function renderTiles(runs) {
          const issues = filteredIssues();
          const closed = issues.filter((i) => i.meta && i.meta.state === 'CLOSED').length;
          const passed = runs.filter((r) => r.status.startsWith('pass')).length;
          const tiles = [
            [
              'Runs',
              String(runs.length),
              runs.length ? Math.round((passed / runs.length) * 100) + '% passed' : '',
            ],
            [
              'Median agent time per run',
              fmtDur(median(runs.map((r) => r.m.agentMs))),
              'Total ' + fmtDur(sum(runs.map((r) => r.m.agentMs))),
            ],
            [
              'Median tokens per run',
              fmtTok(median(runs.map((r) => r.m.tokens))),
              fmtTok(median(runs.map((r) => r.m.output))) + ' output · mostly cache reads',
            ],
            [
              'Median fix passes',
              String(median(runs.map((r) => r.m.fixes))),
              sum(runs.map((r) => r.m.fixes)) + ' fix passes total',
            ],
            [
              'Compactions',
              String(sum(runs.map((r) => r.m.compactions))),
              'Orchestrator and stages',
            ],
            [
              'Issues filed',
              String(issues.length),
              DATA.issueMeta && Object.keys(DATA.issueMeta).length
                ? closed + ' closed since'
                : 'State not fetched',
            ],
          ];
          document.getElementById('tiles').innerHTML = tiles
            .map(
              ([l, v, n]) =>
                `<div class="tile"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="note">${esc(n)}</div></div>`,
            )
            .join('');
        }

        // ---------- trend scatter ----------
        function renderTrend(runs) {
          const host = document.getElementById('trend');
          host.innerHTML = '';
          const metric = METRICS[state.trendMetric];
          document.getElementById('trend-title').textContent = metric.label + ' per run';
          if (!runs.length) {
            host.innerHTML = '<div class="empty">No runs in this filter.</div>';
            return;
          }
          const W = host.clientWidth,
            H = 260,
            m = { l: 52, r: 12, t: 10, b: 26 };
          const svg = el(
            'svg',
            { width: W, height: H, role: 'img', 'aria-label': metric.label + ' per run over time' },
            host,
          );
          let t0 = Math.min(...runs.map((r) => r.start)),
            t1 = Math.max(...runs.map((r) => r.start));
          if (t1 - t0 < 36e5) {
            t0 -= 18e5;
            t1 += 18e5;
          }
          const pad = (t1 - t0) * 0.02;
          t0 -= pad;
          t1 += pad;
          const val = (r) => r.m[state.trendMetric];
          const isDur = state.trendMetric === 'agentMs';
          const yt = isDur
            ? durTicks(Math.max(...runs.map(val)))
            : niceTicks(Math.max(...runs.map(val)));
          const yMax = yt[yt.length - 1] || 1;
          const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
          const y = (v) => H - m.b - (v / yMax) * (H - m.t - m.b);
          for (const v of yt) {
            el(
              'line',
              {
                x1: m.l,
                x2: W - m.r,
                y1: y(v),
                y2: y(v),
                class: v === 0 ? 'baseline' : 'gridline',
              },
              svg,
            );
            text(svg, m.l - 6, y(v) + 4, metric.fmt(v), { 'text-anchor': 'end' });
          }
          const { ticks, step } = timeTicks(t0, t1, Math.max(2, Math.floor((W - m.l) / 90)));
          for (const t of ticks)
            text(
              svg,
              x(t),
              H - 8,
              step >= 864e5
                ? fmtDay(t)
                : new Date(t).toLocaleTimeString(undefined, { hour: 'numeric' }),
              { 'text-anchor': 'middle' },
            );
          for (const r of runs) {
            const o = outcomeOf(r.status);
            const cx = x(r.start),
              cy = y(val(r));
            el(
              'circle',
              {
                cx,
                cy,
                r: r.key === state.selected ? 6 : 4,
                style: `fill:${o.color};stroke:var(--surface);stroke-width:2`,
              },
              svg,
            );
            const hit = el(
              'circle',
              { cx, cy, r: 9, fill: 'transparent', style: 'cursor:pointer' },
              svg,
            );
            hit.addEventListener('mousemove', (ev) => showTip(runTip(r), ev));
            hit.addEventListener('mouseleave', hideTip);
            hit.addEventListener('click', () => selectRun(r.key, true));
          }
          legend(
            document.getElementById('trend-legend'),
            OUTCOMES.filter((o) => runs.some((r) => outcomeOf(r.status) === o)),
          );
        }
        function runTip(r) {
          return (
            `<b>${esc(r.title)}</b><div class="muted">${esc(r.repo)} · ${esc(fmtDate(r.start))}</div>` +
            tipRows([
              ['Outcome', outcomeOf(r.status).label],
              ['Route', r.route],
              ['Agent time', fmtDur(r.m.agentMs)],
              ['Elapsed', fmtDur(r.m.elapsed)],
              ['Tokens', fmtTok(r.m.tokens)],
              ['Peak context', fmtTok(r.m.peak)],
              ['Fix passes', r.m.fixes],
              ['Issues filed', r.m.issues],
            ])
          );
        }

        // ---------- runs per day ----------
        function renderDaily(runs) {
          const host = document.getElementById('daily');
          host.innerHTML = '';
          if (!runs.length) {
            host.innerHTML = '<div class="empty">No runs in this filter.</div>';
            return;
          }
          const dayKey = (t) => {
            const d = new Date(t);
            d.setHours(0, 0, 0, 0);
            return d.getTime();
          };
          const first = dayKey(Math.min(...runs.map((r) => r.start))),
            last = dayKey(Math.max(...runs.map((r) => r.start)));
          const days = [];
          for (let d = new Date(first); d.getTime() <= last; d.setDate(d.getDate() + 1))
            days.push(d.getTime());
          const counts = new Map(days.map((d) => [d, OUTCOMES.map(() => 0)]));
          for (const r of runs)
            counts.get(dayKey(r.start))[OUTCOMES.indexOf(outcomeOf(r.status))]++;
          const W = host.clientWidth,
            H = 220,
            m = { l: 32, r: 8, t: 10, b: 26 };
          const svg = el(
            'svg',
            { width: W, height: H, role: 'img', 'aria-label': 'Runs per day by outcome' },
            host,
          );
          const yt = niceTicks(Math.max(...[...counts.values()].map(sum)));
          const yMax = yt[yt.length - 1] || 1;
          const band = (W - m.l - m.r) / days.length;
          const bw = Math.max(2, Math.min(24, band * 0.7));
          const y = (v) => H - m.b - (v / yMax) * (H - m.t - m.b);
          for (const v of yt) {
            el(
              'line',
              {
                x1: m.l,
                x2: W - m.r,
                y1: y(v),
                y2: y(v),
                class: v === 0 ? 'baseline' : 'gridline',
              },
              svg,
            );
            text(svg, m.l - 6, y(v) + 4, String(v), { 'text-anchor': 'end' });
          }
          const labelEvery = Math.ceil(days.length / Math.max(1, Math.floor((W - m.l) / 56)));
          days.forEach((d, i) => {
            const cx = m.l + band * i + band / 2;
            if (i % labelEvery === 0) text(svg, cx, H - 8, fmtDay(d), { 'text-anchor': 'middle' });
            const c = counts.get(d);
            const total = sum(c);
            if (!total) return;
            let acc = 0;
            const topIdx = c.reduce((t, n, j) => (n ? j : t), -1);
            c.forEach((n, j) => {
              if (!n) return;
              const yTop = y(acc + n),
                yBot = y(acc);
              const h = Math.max(1, yBot - yTop - (acc ? 2 : 0));
              el(
                'path',
                {
                  d: roundedBar(cx - bw / 2, yTop, bw, h, j === topIdx ? 4 : 0, 'top'),
                  style: `fill:${OUTCOMES[j].color}`,
                },
                svg,
              );
              acc += n;
            });
            const hit = el(
              'rect',
              {
                x: m.l + band * i,
                y: m.t,
                width: band,
                height: H - m.t - m.b,
                fill: 'transparent',
              },
              svg,
            );
            hit.addEventListener('mousemove', (ev) =>
              showTip(
                `<b>${esc(fmtDay(d))}</b>` +
                  tipRows([
                    ['Runs', total],
                    ...OUTCOMES.map((o, j) => [o.label, c[j]]).filter(([, n]) => n),
                  ]),
                ev,
              ),
            );
            hit.addEventListener('mouseleave', hideTip);
          });
          legend(
            document.getElementById('daily-legend'),
            OUTCOMES.filter((o) => runs.some((r) => outcomeOf(r.status) === o)),
          );
        }

        // ---------- stage breakdown ----------
        function renderStages(runs) {
          const host = document.getElementById('stages');
          host.innerHTML = '';
          const metric = METRICS[state.stageMetric];
          document.getElementById('stage-sub').textContent =
            'Median ' + metric.label.toLowerCase() + ' per stage run';
          const rows = FAMILIES.map((f) => {
            const vals = runs.flatMap((r) =>
              r.stages.filter((s) => s.family === f).map(metric.stage),
            );
            return { key: f, label: FAMILY_LABEL[f], vals, color: `var(--fam-${f})` };
          }).filter((r) => r.vals.length);
          if (state.stageMetric !== 'agentMs') {
            const o = runs.map((r) => r.orchestrator).filter((o) => o.calls);
            const vals = o.map((o) =>
              state.stageMetric === 'tokens'
                ? o.input + o.cacheRead + o.cacheWrite + o.output
                : state.stageMetric === 'output'
                  ? o.output
                  : o.peakContext,
            );
            if (vals.length)
              rows.push({
                key: 'orchestrator',
                label: 'Orchestrator (per run)',
                vals,
                color: 'var(--fam-orchestrator)',
              });
          }
          if (!rows.length) {
            host.innerHTML = '<div class="empty">No runs in this filter.</div>';
            return;
          }
          const totalAll = sum(rows.map((r) => sum(r.vals)));
          const W = host.clientWidth,
            rowH = 30,
            m = { l: 150, r: 64, t: 4, b: 4 };
          const H = m.t + m.b + rows.length * rowH;
          const svg = el(
            'svg',
            {
              width: W,
              height: H,
              role: 'img',
              'aria-label': 'Median ' + metric.label + ' by stage',
            },
            host,
          );
          const maxV = Math.max(...rows.map((r) => median(r.vals))) || 1;
          const x = (v) => (v / maxV) * (W - m.l - m.r);
          el('line', { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, class: 'baseline' }, svg);
          rows.forEach((r, i) => {
            const med = median(r.vals);
            const cy = m.t + i * rowH + rowH / 2;
            text(svg, m.l - 8, cy + 4, r.label, { 'text-anchor': 'end', class: 'ink' });
            el(
              'path',
              {
                d: roundedBar(m.l, cy - 9, Math.max(1, x(med)), 18, 4, 'right'),
                style: `fill:${r.color}`,
              },
              svg,
            );
            text(svg, m.l + x(med) + 6, cy + 4, metric.fmt(med), { class: 'ink' });
            const hit = el(
              'rect',
              { x: 0, y: cy - rowH / 2, width: W, height: rowH, fill: 'transparent' },
              svg,
            );
            hit.addEventListener('mousemove', (ev) =>
              showTip(
                `<b>${esc(r.label)}</b>` +
                  tipRows([
                    ['Median', metric.fmt(med)],
                    ['90th percentile', metric.fmt(quantile(r.vals, 0.9))],
                    ['Max', metric.fmt(Math.max(...r.vals))],
                    ['Stage runs', r.vals.length],
                    ...(state.stageMetric === 'peak'
                      ? []
                      : [
                          ['Total', metric.fmt(sum(r.vals))],
                          ['Share of total', Math.round((sum(r.vals) / totalAll) * 100) + '%'],
                        ]),
                  ]),
                ev,
              ),
            );
            hit.addEventListener('mouseleave', hideTip);
          });
        }

        // ---------- runs table ----------
        const RUN_COLS = [
          { key: 'start', label: 'Started', val: (r) => r.start, fmt: (r) => fmtDate(r.start) },
          { key: 'repo', label: 'Repo', val: (r) => r.repo, fmt: (r) => esc(r.repo) },
          {
            key: 'title',
            label: 'Task',
            val: (r) => r.title,
            fmt: (r) =>
              `${esc(r.title.length > 90 ? r.title.slice(0, 89) + '…' : r.title)}<div class="muted">${esc(r.slug)}</div>`,
            cls: 'wrap',
          },
          { key: 'route', label: 'Route', val: (r) => r.route, fmt: (r) => esc(r.route) },
          {
            key: 'status',
            label: 'Outcome',
            val: (r) => OUTCOMES.indexOf(outcomeOf(r.status)),
            fmt: (r) => statusHtml(r.status),
          },
          {
            key: 'stages',
            label: 'Stages',
            val: (r) => r.stages.length,
            fmt: (r) =>
              r.stages.length + (r.m.fixes ? ` <span class="chip">${r.m.fixes} fix</span>` : ''),
            num: true,
          },
          {
            key: 'agentMs',
            label: 'Agent time',
            val: (r) => r.m.agentMs,
            fmt: (r) => fmtDur(r.m.agentMs),
            num: true,
          },
          {
            key: 'elapsed',
            label: 'Elapsed',
            val: (r) => r.m.elapsed,
            fmt: (r) => fmtDur(r.m.elapsed),
            num: true,
          },
          {
            key: 'tokens',
            label: 'Tokens',
            val: (r) => r.m.tokens,
            fmt: (r) => fmtTok(r.m.tokens),
            num: true,
          },
          {
            key: 'peak',
            label: 'Peak ctx',
            val: (r) => r.m.peak,
            fmt: (r) => fmtTok(r.m.peak),
            num: true,
          },
          {
            key: 'issues',
            label: 'Issues',
            val: (r) => r.m.issues,
            fmt: (r) => r.m.issues || '',
            num: true,
          },
        ];
        function statusHtml(status) {
          const o = outcomeOf(status);
          return `<span class="status"><i style="background:${o.color}" aria-hidden="true">${o.icon}</i>${esc(status)}</span>`;
        }
        function renderRuns(runs) {
          const col = RUN_COLS.find((c) => c.key === state.sort.key) || RUN_COLS[0];
          const sorted = [...runs].sort((a, b) => {
            const x = col.val(a),
              y = col.val(b);
            return (x > y ? 1 : x < y ? -1 : 0) * state.sort.dir;
          });
          const shown = state.showAll ? sorted : sorted.slice(0, 100);
          document.getElementById('runs-sub').innerHTML =
            `${runs.length} runs. Click a column to sort, a row for detail.` +
            (sorted.length > shown.length
              ? ` <button id="show-all">Show all ${sorted.length}</button>`
              : '');
          const t = document.getElementById('runs');
          t.innerHTML =
            '<thead><tr>' +
            RUN_COLS.map(
              (c) =>
                `<th data-k="${c.key}" class="${c.num ? 'num' : ''}">${esc(c.label)}${c.key === state.sort.key ? (state.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`,
            ).join('') +
            '</tr></thead><tbody>' +
            shown
              .map(
                (r) =>
                  `<tr class="clickable${r.key === state.selected ? ' selected' : ''}" data-run="${esc(r.key)}">` +
                  RUN_COLS.map(
                    (c) => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.fmt(r)}</td>`,
                  ).join('') +
                  '</tr>',
              )
              .join('') +
            '</tbody>';
          t.querySelectorAll('th').forEach((th) =>
            th.addEventListener('click', () => {
              const k = th.dataset.k;
              state.sort = {
                key: k,
                dir:
                  state.sort.key === k
                    ? -state.sort.dir
                    : k === 'repo' || k === 'title' || k === 'route'
                      ? 1
                      : -1,
              };
              renderRuns(filteredRuns());
            }),
          );
          t.querySelectorAll('tbody tr').forEach((tr) =>
            tr.addEventListener('click', () => selectRun(tr.dataset.run, true)),
          );
          const btn = document.getElementById('show-all');
          if (btn)
            btn.addEventListener('click', () => {
              state.showAll = true;
              renderRuns(filteredRuns());
            });
        }

        // ---------- run detail ----------
        /** Maps real time to a compressed axis where idle gaps longer than maxGap shrink to maxGap. */
        function compressor(intervals, maxGap) {
          const iv = intervals.filter(([a, b]) => b >= a).sort((a, b) => a[0] - b[0]);
          const merged = [];
          for (const [a, b] of iv) {
            if (merged.length && a <= merged[merged.length - 1][1] + maxGap)
              merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], b);
            else merged.push([a, b]);
          }
          const segs = [],
            breaks = [];
          let off = 0;
          merged.forEach(([a, b], i) => {
            if (i) {
              const gap = a - merged[i - 1][1];
              breaks.push({ at: off + maxGap / 2, gap });
              off += maxGap;
            }
            segs.push({ a, b, off });
            off += b - a;
          });
          const map = (t) => {
            if (!segs.length) return 0;
            if (t <= segs[0].a) return 0;
            for (let i = 0; i < segs.length; i++) {
              const s = segs[i];
              if (t <= s.b) return s.off + (t - s.a);
              const n = segs[i + 1];
              if (n && t < n.a) return s.off + (s.b - s.a) + ((t - s.b) / (n.a - s.b)) * maxGap;
            }
            const s = segs[segs.length - 1];
            return s.off + (s.b - s.a);
          };
          return { map, total: off, breaks };
        }

        function selectRun(key, scroll) {
          state.selected = key;
          try {
            history.replaceState(
              null,
              '',
              key ? '#run=' + encodeURIComponent(key) : location.pathname,
            );
          } catch {}
          const runs = filteredRuns();
          renderTrend(runs);
          renderRuns(runs);
          renderDetail();
          if (scroll)
            document
              .getElementById('detail')
              .scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderDetail() {
          const host = document.getElementById('detail');
          const run = runByKey.get(state.selected);
          if (!run) {
            host.hidden = true;
            return;
          }
          host.hidden = false;
          const o = run.orchestrator;
          const tiles = [
            ['Agent time', fmtDur(run.m.agentMs)],
            ['Elapsed', fmtDur(run.m.elapsed)],
            ['Tokens', fmtTok(run.m.tokens)],
            ['Orchestrator tokens', fmtTok(run.m.orchTokens)],
            ['Peak stage context', fmtTok(run.m.peak)],
            ['Orchestrator peak', fmtTok(o.peakContext)],
            ['Compactions', run.m.compactions],
            ['Issues filed', run.m.issues],
          ];
          host.innerHTML = `
    <div class="card-head"><div>
      <h2>${esc(run.title)}</h2>
      <div class="sub">${esc(run.repo)} / ${esc(run.slug)} · ${esc(run.route)} route · ${statusHtml(run.status)} · ${esc(fmtDate(run.start))}${run.sessions.length > 1 ? ` · ${run.sessions.length} sessions` : ''}</div>
    </div><button id="close-detail">Close</button></div>
    <div class="tiles">${tiles.map(([l, v]) => `<div class="tile"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`).join('')}</div>
    <h3>Timeline</h3><div class="sub">Idle gaps over 5 minutes are collapsed.</div><div id="waterfall"></div>
    <h3>Context size</h3><div id="ctx"></div><div class="legend" id="ctx-legend"></div>
    <h3>Stages</h3><div class="sub">Click a stage to list its tool calls. Calls under ${DATA.opThreshold.durMs / 1000}s and ${fmtTok(DATA.opThreshold.tokens)} tokens are grouped by tool.</div>
    <div class="table-wrap" style="max-height:none"><table id="stage-table"></table></div>
    ${run.issues.length ? '<h3>Issues filed during this run</h3><div class="table-wrap" style="max-height:none"><table id="run-issues"></table></div>' : ''}`;
          host
            .querySelector('#close-detail')
            .addEventListener('click', () => selectRun(null, false));

          const intervals = run.stages.map((s) => [s.start, s.end]);
          if (o.contextCurve.length)
            intervals.push([o.contextCurve[0][0], o.contextCurve[o.contextCurve.length - 1][0]]);
          const cmp = compressor(intervals, 5 * 60 * 1000);
          renderWaterfall(run, cmp);
          renderContext(run, cmp);
          renderStageTable(run);
          if (run.issues.length)
            renderIssueRows(
              document.getElementById('run-issues'),
              run.issues.map((i) => ({
                ...i,
                run: run.key,
                repo: run.repo,
                meta: DATA.issueMeta[i.url],
              })),
              false,
            );
        }

        function axisFor(svg, cmp, x, y0, run) {
          for (const b of cmp.breaks) {
            el('line', { x1: x(b.at), x2: x(b.at), y1: 0, y2: y0, class: 'gridline' }, svg);
            text(svg, x(b.at), y0 + 14, '+' + fmtDur(b.gap) + ' idle', { 'text-anchor': 'middle' });
          }
          text(
            svg,
            x(0),
            y0 + 14,
            new Date(run.start).toLocaleTimeString(undefined, {
              hour: 'numeric',
              minute: '2-digit',
            }),
            { 'text-anchor': 'start' },
          );
          text(
            svg,
            x(cmp.total),
            y0 + 14,
            new Date(run.end).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }),
            { 'text-anchor': 'end' },
          );
        }

        function stageTip(s) {
          return (
            `<b>${esc(s.stage)}</b><div class="muted">${esc(s.model)} · ${esc(fmtDate(s.start))}</div>` +
            tipRows([
              ['Active time', fmtDur(s.activeMs)],
              ['Tool time', fmtDur(s.toolMs)],
              ['Model time', fmtDur(Math.max(0, s.activeMs - s.toolMs))],
              ['API calls', s.calls],
              ['Output tokens', fmtTok(s.output)],
              ['Fresh input', fmtTok(s.input + s.cacheWrite)],
              ['Cache read', fmtTok(s.cacheRead)],
              ['Peak context', fmtTok(s.peakContext)],
            ])
          );
        }

        function renderWaterfall(run, cmp) {
          const host = document.getElementById('waterfall');
          const W = host.clientWidth,
            rowH = 24,
            m = { l: 110, r: 70, t: 6, b: 22 };
          const rows = run.stages;
          const H = m.t + m.b + rows.length * rowH;
          const svg = el(
            'svg',
            { width: W, height: H, role: 'img', 'aria-label': 'Stage timeline' },
            host,
          );
          const x = (v) => m.l + (v / (cmp.total || 1)) * (W - m.l - m.r);
          axisFor(svg, cmp, x, H - m.b, run);
          rows.forEach((s, i) => {
            const cy = m.t + i * rowH + rowH / 2;
            text(svg, m.l - 8, cy + 4, s.stage, { 'text-anchor': 'end', class: 'ink' });
            const x0 = x(cmp.map(s.start)),
              x1 = Math.max(x0 + 3, x(cmp.map(s.end)));
            el(
              'path',
              {
                d: roundedBar(x0, cy - 7, x1 - x0, 14, 4, 'right'),
                style: `fill:var(--fam-${s.family})`,
              },
              svg,
            );
            text(svg, x1 + 6, cy + 4, fmtDur(s.activeMs), { class: 'ink' });
            for (const c of s.compactions)
              el(
                'circle',
                {
                  cx: x(cmp.map(c.ts)),
                  cy,
                  r: 5,
                  style: 'fill:var(--ink);stroke:var(--surface);stroke-width:2',
                },
                svg,
              );
            const hit = el(
              'rect',
              { x: 0, y: cy - rowH / 2, width: W, height: rowH, fill: 'transparent' },
              svg,
            );
            hit.addEventListener('mousemove', (ev) => showTip(stageTip(s), ev));
            hit.addEventListener('mouseleave', hideTip);
          });
        }

        function renderContext(run, cmp) {
          const host = document.getElementById('ctx');
          const W = host.clientWidth,
            H = 220,
            m = { l: 52, r: 12, t: 10, b: 22 };
          const svg = el(
            'svg',
            { width: W, height: H, role: 'img', 'aria-label': 'Context size over time' },
            host,
          );
          const series = run.stages.map((s) => ({
            label: s.stage,
            color: `var(--fam-${s.family})`,
            pts: s.contextCurve.map(([t, c]) => [s.start + t, c]),
          }));
          const o = run.orchestrator;
          if (o.contextCurve.length)
            series.unshift({
              label: 'Orchestrator',
              color: 'var(--fam-orchestrator)',
              pts: o.contextCurve,
            });
          const all = series
            .flatMap((s) => s.pts.map(([, c]) => c))
            .concat(o.compactions.map((c) => c.preTokens));
          const yt = niceTicks(Math.max(1, ...all));
          const yMax = yt[yt.length - 1];
          const x = (t) => m.l + (cmp.map(t) / (cmp.total || 1)) * (W - m.l - m.r);
          const y = (v) => H - m.b - (v / yMax) * (H - m.t - m.b);
          for (const v of yt) {
            el(
              'line',
              {
                x1: m.l,
                x2: W - m.r,
                y1: y(v),
                y2: y(v),
                class: v === 0 ? 'baseline' : 'gridline',
              },
              svg,
            );
            text(svg, m.l - 6, y(v) + 4, fmtTok(v), { 'text-anchor': 'end' });
          }
          axisFor(svg, cmp, (v) => m.l + (v / (cmp.total || 1)) * (W - m.l - m.r), H - m.b, run);
          const pts = [];
          for (const s of series) {
            if (!s.pts.length) continue;
            // Orchestrator points come from several windows; break the line where the run was idle.
            let d = '',
              prev = null;
            for (const [t, c] of s.pts) {
              d +=
                (prev !== null && t - prev > 10 * 60 * 1000 ? 'M' : d ? 'L' : 'M') +
                x(t).toFixed(1) +
                ',' +
                y(c).toFixed(1);
              prev = t;
              pts.push({ t, c, s });
            }
            el(
              'path',
              {
                d,
                style: `fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round`,
              },
              svg,
            );
          }
          for (const c of o.compactions) {
            const dot = el(
              'circle',
              {
                cx: x(c.ts),
                cy: y(c.preTokens),
                r: 5,
                style: 'fill:var(--ink);stroke:var(--surface);stroke-width:2',
              },
              svg,
            );
            dot.addEventListener('mousemove', (ev) =>
              showTip(
                `<b>Compaction (${esc(c.trigger)})</b>` +
                  tipRows([
                    ['Before', fmtTok(c.preTokens)],
                    ['After', fmtTok(c.postTokens)],
                    ['Took', fmtDur(c.durationMs)],
                  ]),
                ev,
              ),
            );
            dot.addEventListener('mouseleave', hideTip);
          }
          const marker = el(
            'circle',
            { r: 5, style: 'display:none;stroke:var(--surface);stroke-width:2' },
            svg,
          );
          const overlay = el(
            'rect',
            { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' },
            svg,
          );
          overlay.addEventListener('mousemove', (ev) => {
            const r = svg.getBoundingClientRect();
            const mx = ev.clientX - r.left,
              my = ev.clientY - r.top;
            let best = null,
              bd = Infinity;
            for (const p of pts) {
              const d = Math.hypot(x(p.t) - mx, (y(p.c) - my) / 4);
              if (d < bd) {
                bd = d;
                best = p;
              }
            }
            if (!best) return;
            marker.setAttribute('cx', x(best.t));
            marker.setAttribute('cy', y(best.c));
            marker.setAttribute(
              'style',
              `display:block;fill:${best.s.color};stroke:var(--surface);stroke-width:2`,
            );
            showTip(
              `<b>${esc(best.s.label)}</b>` +
                tipRows([
                  ['Time', fmtDate(best.t)],
                  ['Context', fmtTok(best.c)],
                ]),
              ev,
            );
          });
          overlay.addEventListener('mouseleave', () => {
            hideTip();
            marker.setAttribute('style', 'display:none');
          });
          const seen = new Set();
          legend(
            document.getElementById('ctx-legend'),
            series
              .filter((s) => s.pts.length)
              .map((s) => {
                const fam = run.stages.find((st) => st.stage === s.label)?.family;
                const label = fam ? FAMILY_LABEL[fam] : s.label;
                if (seen.has(label)) return null;
                seen.add(label);
                return { label, color: s.color };
              })
              .filter(Boolean)
              .concat(o.compactions.length ? [{ label: 'Compaction', color: 'var(--ink)' }] : []),
          );
        }

        function renderStageTable(run) {
          const t = document.getElementById('stage-table');
          const cols = [
            'Stage',
            'Model',
            'Active',
            'Tool time',
            'Model time',
            'Calls',
            'Output',
            'Fresh input',
            'Cache read',
            'Peak ctx',
          ];
          const body = run.stages
            .map(
              (s, i) => `<tr class="clickable" data-i="${i}">
      <td><span class="sw" style="background:var(--fam-${s.family})"></span> ${esc(s.stage)}</td><td>${esc(s.model.replace(/^claude-/, ''))}</td>
      <td class="num">${fmtDur(s.activeMs)}</td><td class="num">${fmtDur(s.toolMs)}</td><td class="num">${fmtDur(Math.max(0, s.activeMs - s.toolMs))}</td>
      <td class="num">${s.calls}</td><td class="num">${fmtTok(s.output)}</td><td class="num">${fmtTok(s.input + s.cacheWrite)}</td>
      <td class="num">${fmtTok(s.cacheRead)}</td><td class="num">${fmtTok(s.peakContext)}</td></tr>`,
            )
            .join('');
          const o = run.orchestrator;
          const orch = o.calls
            ? `<tr><td><span class="sw" style="background:var(--fam-orchestrator)"></span> orchestrator</td><td></td><td class="num muted">–</td><td class="num muted">–</td><td class="num muted">–</td>
      <td class="num">${o.calls}</td><td class="num">${fmtTok(o.output)}</td><td class="num">${fmtTok(o.input + o.cacheWrite)}</td><td class="num">${fmtTok(o.cacheRead)}</td><td class="num">${fmtTok(o.peakContext)}</td></tr>`
            : '';
          t.innerHTML = `<thead><tr>${cols.map((c, i) => `<th class="${i > 1 ? 'num' : ''}" style="cursor:default">${c}</th>`).join('')}</tr></thead><tbody>${body}${orch}</tbody>`;
          t.querySelectorAll('tr[data-i]').forEach((tr) =>
            tr.addEventListener('click', () => {
              const next = tr.nextElementSibling;
              if (next && next.classList.contains('ops')) {
                next.remove();
                return;
              }
              const s = run.stages[Number(tr.dataset.i)];
              const ops = [...s.ops].sort((a, b) => b.durMs - a.durMs);
              const minor = s.minorOps;
              const row = document.createElement('tr');
              row.className = 'ops';
              row.innerHTML = `<td colspan="${cols.length}"><table>
      <thead><tr><th class="num" style="cursor:default">Time</th><th style="cursor:default">Tool</th><th style="cursor:default">Call</th><th class="num" style="cursor:default">Result tokens</th><th class="num" style="cursor:default">Output tokens</th></tr></thead><tbody>
      ${ops.map((op) => `<tr><td class="num">${fmtDur(op.durMs)}</td><td>${esc(op.tool)}${op.isError ? ' <span class="chip">error</span>' : ''}</td><td class="label">${esc(op.label)}</td><td class="num">${fmtTok(op.resultTokens)}</td><td class="num">${fmtTok(op.outTokens)}</td></tr>`).join('')}
      ${minor.map((g) => `<tr><td class="num">${fmtDur(g.durMs)}</td><td>${esc(g.tool)}</td><td class="label muted">${g.count} small call${g.count === 1 ? '' : 's'}</td><td class="num">${fmtTok(g.resultTokens)}</td><td class="num">${fmtTok(g.outTokens)}</td></tr>`).join('')}
      ${!ops.length && !minor.length ? '<tr><td colspan="5" class="muted">No tool calls.</td></tr>' : ''}
      </tbody></table></td>`;
              tr.after(row);
            }),
          );
        }

        // ---------- issues ----------
        function filteredIssues() {
          return allIssues.filter(
            (i) =>
              (state.repo === 'all' || i.repo === state.repo) &&
              inPeriod(i.ts) &&
              (state.route === 'all' || (i.run && runByKey.get(i.run).route === state.route)),
          );
        }
        function renderIssueRows(t, issues, withRun) {
          t.innerHTML =
            `<thead><tr><th style="cursor:default">Filed</th><th style="cursor:default">Issue</th><th style="cursor:default">State</th><th style="cursor:default">From</th>${withRun ? '<th style="cursor:default">Run</th>' : ''}</tr></thead><tbody>` +
            issues
              .sort((a, b) => b.ts - a.ts)
              .map((i) => {
                const num = (i.url.match(/(\d+)$/) || [])[1];
                const title = (i.meta && i.meta.title) || i.title || '(title unknown)';
                const st = i.meta
                  ? i.meta.state === 'CLOSED'
                    ? 'Closed ' + fmtDay(i.meta.closedAt)
                    : 'Open'
                  : '–';
                const run = i.run ? runByKey.get(i.run) : null;
                return (
                  `<tr><td>${esc(fmtDate(i.ts))}</td><td class="wrap"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.repo)}#${num}</a> ${esc(title)}</td><td>${esc(st)}</td><td>${esc(i.source)}</td>` +
                  (withRun
                    ? `<td>${run ? `<a href="#" data-run="${esc(run.key)}">${esc(run.slug)}</a>` : '<span class="muted">outside a run</span>'}</td>`
                    : '') +
                  '</tr>'
                );
              })
              .join('') +
            '</tbody>';
          t.querySelectorAll('a[data-run]').forEach((a) =>
            a.addEventListener('click', (e) => {
              e.preventDefault();
              selectRun(a.dataset.run, true);
            }),
          );
        }
        function renderIssues() {
          const issues = filteredIssues();
          const inRuns = issues.filter((i) => i.run).length;
          document.getElementById('issues-sub').textContent = issues.length
            ? `${issues.length} issues created with gh issue create: ${inRuns} during litecode runs, ${issues.length - inRuns} elsewhere.`
            : 'No issues in this filter.';
          renderIssueRows(document.getElementById('issues'), issues, true);
        }

        // ---------- controls ----------
        function segmented(id, key, onChange) {
          const host = document.getElementById(id);
          host.innerHTML = Object.entries(METRICS)
            .map(
              ([k, v]) =>
                `<button data-k="${k}" aria-pressed="${state[key] === k}">${esc(v.label)}</button>`,
            )
            .join('');
          host.querySelectorAll('button').forEach((b) =>
            b.addEventListener('click', () => {
              state[key] = b.dataset.k;
              save();
              host
                .querySelectorAll('button')
                .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
              onChange();
            }),
          );
        }
        function renderAll() {
          const runs = filteredRuns();
          renderTiles(runs);
          renderTrend(runs);
          renderDaily(runs);
          renderStages(runs);
          renderRuns(runs);
          renderDetail();
          renderIssues();
        }

        const repos = [...new Set(DATA.runs.map((r) => r.repo))].sort();
        const repoSel = document.getElementById('f-repo');
        repoSel.innerHTML =
          '<option value="all">All repos</option>' +
          repos.map((r) => `<option>${esc(r)}</option>`).join('');
        if (state.repo !== 'all' && !repos.includes(state.repo)) state.repo = 'all';
        repoSel.value = state.repo;
        document.getElementById('f-days').value = String(state.days);
        document.getElementById('f-route').value = state.route;
        repoSel.addEventListener('change', () => {
          state.repo = repoSel.value;
          save();
          renderAll();
        });
        document.getElementById('f-days').addEventListener('change', (e) => {
          state.days = Number(e.target.value);
          save();
          renderAll();
        });
        document.getElementById('f-route').addEventListener('change', (e) => {
          state.route = e.target.value;
          save();
          renderAll();
        });
        segmented('trend-metric', 'trendMetric', () => renderTrend(filteredRuns()));
        segmented('stage-metric', 'stageMetric', () => renderStages(filteredRuns()));
        document.getElementById('generated').textContent =
          `${DATA.runs.length} runs from ${fmtDay(DATA.runs[0]?.start ?? Date.now())} to ${fmtDay(DATA.runs[DATA.runs.length - 1]?.start ?? Date.now())}. Generated ${fmtDate(DATA.generatedAt)}.`;
        let rt;
        addEventListener('resize', () => {
          clearTimeout(rt);
          rt = setTimeout(renderAll, 150);
        });
        const linked = decodeURIComponent((location.hash.match(/^#run=(.+)$/) || [])[1] || '');
        if (runByKey.has(linked)) state.selected = linked;
        renderAll();
      })();
    </script>
  </body>
</html>
